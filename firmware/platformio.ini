; OpenFC v1.4 firmware — PlatformIO configuration
;
; Target board: ESP32-S3-DevKitC-1 (for prototyping)
; Production target: custom PCB with ESP32-S3-WROOM-1-N16R8 module
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor -b 115200
;
; fw_hash (spec §8) is computed at runtime by the firmware via
; esp_partition_get_sha256() on the running app partition, so no build-time hash
; embedding is needed. The same value is reproducible offline from firmware.bin
; (esptool image_info "Validation Hash") for recording in the web manifest.

[env:esp32-s3-devkitc-1]
platform = espressif32@^6.6.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

; Flash mode MUST be dio: the ESP32-S3-WROOM-1-N16R8 modules on this board
; boot-loop the 2nd-stage bootloader (TG0WDT_SYS_RST) when flashed with a qio
; image. Pinning it here makes every build, upload and merge inherit dio so a
; qio regression can't recur.
board_build.flash_mode = dio

; Serial goes over UART0 -> CH340C bridge (the board's only serial path; the
; native USB-Serial-JTAG D-/D+ pins are unused per the hardware spec). Mapping
; Serial to the native USB (CDC_ON_BOOT=1) makes the firmware talk to a dead
; interface, so it must stay 0 for this board.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3
    -DOPENFC_HW_VERSION=\"1.1\"
    -DOPENFC_FW_VERSION=\"1.4.0\"
    ; Wire-protocol revision reported in hello. 1 = the implicit v1.2 protocol
    ; (no `proto` field); 2 adds get_info and the `diag` state flag; 3 adds
    ; period tokens (match_id/period_seq), resync, end_period and device_id
    ; binding, for hosts that reattach mid-match.
    -DOPENFC_PROTO_VERSION=3

monitor_speed = 115200
monitor_filters = colorize, time

lib_deps =
    bblanchon/ArduinoJson@^7.0.4
