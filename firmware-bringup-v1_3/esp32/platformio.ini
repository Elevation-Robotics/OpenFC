; OpenFC V1_3 BRING-UP firmware (ESP32-S3 side) — PlatformIO configuration
;
; NOT the production build. Targets the new "Open_FC_V1_3 REV A" prototype
; (dual-MCU: this ESP32-S3-WROOM + a companion RP2350, see
; ../rp2350/platformio.ini). Deliberately a separate PlatformIO project from
; ../../firmware/ so it can never be picked up by the production build or
; the web flasher's "official firmware" path.
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor -b 115200

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32@^6.6.0
board = esp32-s3-devkitc-1
framework = arduino

; CORRECTED FROM PLAN (bench-confirmed 2026-09-01): esptool's chip probe on
; the actual connected V1_3 board reports 8MB flash, not the 16MB assumed by
; analogy with the production N16R8 module — flashing with 16MB configured
; boot-looped with "Detected size(8192k) smaller than the size in the binary
; image header(16384k)". This board's WROOM part is an 8MB variant; update
; if a later revision changes it.
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB

; Same dio requirement as the production board's WROOM-1-N16R8 modules — see
; ../../firmware/platformio.ini's note. Confirm the V1_3 module part matches
; before assuming this still applies, but default to the safe known-good mode.
board_build.flash_mode = dio

; This board is CH340C-only (UART0), same as production — native
; USB-Serial-JTAG is not wired to anything useful here either.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3
    -DOPENFC_HW_VERSION=\"1.3-bringup\"
    -DOPENFC_FW_VERSION=\"0.1.6-bringup\"
    ; Development tools (bus capture, A<->B relay; see src/devtools.cpp).
    ; On for bench builds; the release env below turns them off.
    -DOPENFC_DEVTOOLS=1

monitor_speed = 115200
monitor_filters = colorize, time

lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    adafruit/Adafruit NeoPixel@^1.12.3

; What the web flasher gets: same build without the dev tools.
; tools/publish_firmware.py builds this env.  pio run -e release
[env:release]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -UOPENFC_DEVTOOLS
    -DOPENFC_DEVTOOLS=0
