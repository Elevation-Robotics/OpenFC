; OpenFC V1_3 BRING-UP firmware (RP2350 "Serial Expander" side)
;
; NOT production firmware. Companion to ../esp32/, reached over a slave SPI
; link (see include/openfc_spi_link.h) to drive Smart ports C/D.
;
; OPEN ITEMS (do not assume settled — see include/openfc_pins_rp2350.h and
; main.cpp's file header for the "spike" this whole project is):
;   - board = rpipico2 targets the stock Pico 2 (external QSPI flash, 4MB).
;     This board uses an RP2354A (flash-in-package). Confirm the actual
;     flash size from the BOM and whether a custom board JSON is needed
;     before trusting board_build.flash_size below.
;   - Slave-mode hardware SPI on spi0 (main.cpp) is unverified on real
;     silicon for this project; flag any failure here rather than silently
;     reworking it into a busy-poll / PIO approach without a note.
;
; Build:   pio run
; Upload:  pio run -t upload   (or drag firmware.uf2 onto the RP2350's mass-
;                                storage bootloader — see J1 SWD header as the
;                                more reliable fallback while BOOT_CTRL
;                                sequencing from the ESP32 is unverified)

[env:rpipico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino

board_build.core = earlephilhower
board_build.flash_size = 4MB

monitor_speed = 115200
