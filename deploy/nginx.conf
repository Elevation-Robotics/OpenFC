# Serves the Next.js static export. Replaces nginx's default server block.
#
# Coolify's proxy terminates TLS and forwards plain HTTP here, so this block is
# HTTP-only and must not redirect to HTTPS itself — that would loop.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # The firmware images are ~350 KB each and every flash downloads one.
    sendfile    on;
    tcp_nopush  on;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript
                      application/json image/svg+xml application/manifest+json;
    # .bin firmware is already incompressible; gzipping it only burns CPU.

    # Container-level health check. Coolify polls this to decide when the new
    # deployment is live, so it must not depend on any application state.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # next.config.js sets trailingSlash: true, so routes are directories with an
    # index.html. Fall back to $uri.html as well so /docs and /docs/ both work.
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        # A stale HTML shell would reference _next chunks deleted by the deploy.
        add_header Cache-Control "no-cache, must-revalidate" always;
        # =404 rather than a direct /404.html fallback: naming the file here
        # would serve it with a 200 status, so a client probing for a missing
        # asset would be told it exists. error_page below renders the same page
        # with a truthful status.
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Immutable: filenames are content-hashed by Next.js.
    location /_next/static/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Public firmware API. Cross-origin readable by design — third-party field
    # management software verifies board hashes against these files.
    location /api/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Access-Control-Allow-Origin  "*"     always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Max-Age       "86400" always;
        # Short TTL: a newly certified release should propagate in minutes, and
        # these files are ~1 KB so revalidating is cheap.
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        default_type application/json;

        if ($request_method = OPTIONS) {
            return 204;
        }

        try_files $uri =404;
    }

    # Firmware binaries. The version is in the filename, so a given URL never
    # changes content — but keep them CORS-readable so a third-party flasher can
    # fetch them, and verify the hash from /api/v1 against the same bytes.
    location /firmware/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/conf.d/security-headers.conf;
        internal;
    }
}
