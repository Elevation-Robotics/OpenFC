# Included into every location block rather than set once at server level.
#
# nginx's add_header does not merge: a location that sets any add_header of its
# own discards every add_header inherited from its parent. Since /api/ and
# /firmware/ set CORS headers, they would silently lose these if these were
# declared only once on the server block.

# Web Serial needs a secure context. TLS is terminated by Coolify's proxy.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
